[project]
name = "usai-claude-proxy"
version = "0.1.0"
description = "Translates the Anthropic Messages API (Claude Code) to USAi chat/completions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
usai-claude-proxy = "main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
